<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - QuirklessArt</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Ballet:opsz@16..72&family=Barlow:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="../../index.html" class="logo">Quirkless<span>Art</span></a>
        <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="../../index.html">Inicio</a></li>
            <li><a href="Ilustraciones.html">Ilustraciones</a></li>
            <li><a href="Comisiones.html">Comisiones</a></li>
            <li><a href="SobreMi.html">Sobre mí</a></li>
            <li><a href="Contacto.html">Contacto</a></li>
            <li><a href="Login.html" class="actual" aria-current="page">Login</a></li>
        </ul>
    </nav>

    <header>
        <h1>Crear cuenta</h1>
    </header>

    <main class="auth">
        <section class="auth-card" aria-labelledby="auth-titulo">
            <h2 id="auth-titulo">Únete</h2>
            <p class="auth-intro">Crea tu cuenta para recibir y gestionar solicitudes de comisión.</p>

            <form id="formRegistro" class="panel-form auth-form">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" autocomplete="name" placeholder="Tu nombre o seudónimo" maxlength="60" required>

                <label for="email">Correo</label>
                <input type="email" id="email" autocomplete="email" placeholder="tucorreo@gmail.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6" required>

                <label for="password2">Repite la contraseña</label>
                <input type="password" id="password2" autocomplete="new-password" placeholder="Escríbela otra vez" minlength="6" required>

                <label for="codigo">Código de invitación (opcional)</label>
                <input type="password" id="codigo" autocomplete="off" placeholder="Solo si el administrador te dio uno">

                <button type="submit">Crear cuenta</button>

                <p id="registroMensaje" class="auth-mensaje" role="alert" aria-live="polite"></p>
            </form>

            <p class="auth-alterno">¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 JC</p>
        <p>Ivan Tuesca</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
</body>
</html>
